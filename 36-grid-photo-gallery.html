<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Photo Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 1000px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
        }

        .gallery img:hover {
            transform: scale(1.03);
            transition: 0.3s;
        }

        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 450px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <div class="gallery">

        <img src="https://placehold.co/400x300?text=Photo+1" alt="Gallery photo 1">

        <img src="https://placehold.co/400x300?text=Photo+2" alt="Gallery photo 2">

        <img src="https://placehold.co/400x300?text=Photo+3" alt="Gallery photo 3">

        <img src="https://placehold.co/400x300?text=Photo+4" alt="Gallery photo 4">

        <img src="https://placehold.co/400x300?text=Photo+5" alt="Gallery photo 5">

        <img src="https://placehold.co/400x300?text=Photo+6" alt="Gallery photo 6">

    </div>

</body>
</html>
