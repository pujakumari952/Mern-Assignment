<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Dashboard Areas</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 70px 1fr 50px;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            min-height: 100vh;
        }

        .header {
            grid-area: header;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: #34495e;
            color: white;
            padding: 20px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            margin: 20px 0;
        }

        .main {
            grid-area: main;
            padding: 25px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }

        .footer {
            grid-area: footer;
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 15px;
        }

        @media (max-width: 600px) {
            .dashboard {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr auto;
                grid-template-areas:
                    "header"
                    "sidebar"
                    "main"
                    "footer";
            }

            .sidebar a {
                display: inline-block;
                margin-right: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <header class="header">
            <h2>My Dashboard</h2>
        </header>

        <aside class="sidebar">
            <h3>Menu</h3>
            <a href="#">Home</a>
            <a href="#">Profile</a>
            <a href="#">Reports</a>
            <a href="#">Settings</a>
        </aside>

        <main class="main">
            <h1>Dashboard Overview</h1>
            <p>Welcome to your dashboard.</p>

            <div class="cards">

                <div class="card">
                    <h3>Total Students</h3>
                    <h2>250</h2>
                </div>

                <div class="card">
                    <h3>Courses</h3>
                    <h2>12</h2>
                </div>

                <div class="card">
                    <h3>Assignments</h3>
                    <h2>18</h2>
                </div>

            </div>
        </main>

        <footer class="footer">
            <p>© 2026 My Dashboard</p>
        </footer>

    </div>

</body>
</html>
