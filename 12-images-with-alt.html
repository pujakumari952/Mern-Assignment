<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images with Alt Text</title>
</head>
<body>

    <h1>My Image Gallery</h1>
    <p>Here are some sample images with alternative text.</p>

    <section>
        <h2>Nature</h2>
        <img src="nature.jpg" alt="Beautiful green mountains and trees" width="300">
    </section>

    <section>
        <h2>Flowers</h2>
        <img src="flowers.jpg" alt="Colorful flowers in a garden" width="300">
    </section>

    <section>
        <h2>Animals</h2>
        <img src="animals.jpg" alt="A group of animals in nature" width="300">
    </section>

</body>
</html>
