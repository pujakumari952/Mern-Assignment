<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breakpoints Multi Screen</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .card {
            background-color: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #3498db;
            margin-bottom: 10px;
        }

        /* Tablet Screen */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
            }

            header {
                background-color: #16a085;
            }
        }

        /* Mobile Screen */
        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
                padding: 15px;
            }

            header {
                background-color: #8e44ad;
                padding: 20px;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Responsive Web Design</h1>
        <p>Mobile, Tablet and Desktop Layout</p>
    </header>

    <main class="container">

        <div class="card">
            <h2>Mobile</h2>
            <p>Single-column layout for smaller screens.</p>
        </div>

        <div class="card">
            <h2>Tablet</h2>
            <p>Two-column layout for medium screens.</p>
        </div>

        <div class="card">
            <h2>Desktop</h2>
            <p>Three-column layout for larger screens.</p>
        </div>

    </main>

</body>
</html>
