<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Position and Z-Index</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .hero {
            height: 400px;
            background: linear-gradient(to right, #3498db, #6c5ce7);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero h1 {
            font-size: 40px;
        }

        .hero p {
            font-size: 18px;
        }

        .badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: orange;
            color: black;
            padding: 10px 15px;
            border-radius: 5px;
            z-index: 3;
        }

        .circle {
            position: absolute;
            width: 180px;
            height: 180px;
            background-color: rgba(255,255,255,0.2);
            border-radius: 50%;
            top: 100px;
            left: 15%;
            z-index: 1;
        }

        button {
            padding: 12px 25px;
            border: none;
            background-color: white;
            color: #3498db;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <section class="hero">

        <div class="circle"></div>

        <div class="badge">Welcome</div>

        <div class="hero-content">
            <h1>Welcome to My Website</h1>
            <p>Learn, Explore and Grow with Us.</p>
            <button>Get Started</button>
        </div>

    </section>

</body>
</html>
