<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>

    <h1>Job Application Form</h1>

    <form action="#" method="post">

        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" required><br><br>

        <label for="position">Position Applied For:</label><br>
        <select id="position" name="position">
            <option value="">Select Position</option>
            <option value="accountant">Accountant</option>
            <option value="marketing">Marketing Executive</option>
            <option value="hr">HR Assistant</option>
            <option value="sales">Sales Executive</option>
        </select><br><br>

        <label for="education">Highest Education:</label><br>
        <input type="text" id="education" name="education"><br><br>

        <label for="experience">Work Experience:</label><br>
        <select id="experience" name="experience">
            <option value="">Select Experience</option>
            <option value="fresher">Fresher</option>
            <option value="1-2">1-2 Years</option>
            <option value="3-5">3-5 Years</option>
            <option value="5+">More than 5 Years</option>
        </select><br><br>

        <label for="resume">Upload Resume:</label><br>
        <input type="file" id="resume" name="resume"><br><br>

        <label for="message">Why should we hire you?</label><br>
        <textarea id="message" name="message" rows="4" cols="30"></textarea><br><br>

        <button type="submit">Submit Application</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
