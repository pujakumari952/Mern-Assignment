<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selector Types</title>

    <style>
        /* Element Selector */
        p {
            color: blue;
        }

        /* Class Selector */
        .highlight {
            background-color: yellow;
        }

        /* ID Selector */
        #heading {
            color: green;
        }

        /* Universal Selector */
        * {
            font-family: Arial, sans-serif;
        }

        /* Group Selector */
        h2, h3 {
            color: purple;
        }
    </style>
</head>

<body>

    <h1 id="heading">CSS Selector Types</h1>

    <p>This paragraph uses an element selector.</p>

    <p class="highlight">This paragraph uses a class selector.</p>

    <h2>This heading uses a group selector.</h2>

    <h3>This is another group selector example.</h3>

</body>
</html>
