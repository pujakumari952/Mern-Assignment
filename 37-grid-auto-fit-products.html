<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Auto Fit Products</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 30px auto;
        }

        .product-card {
            background-color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .product-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
        }

        .product-card h2 {
            color: #2c3e50;
            font-size: 20px;
        }

        .price {
            color: green;
            font-weight: bold;
            font-size: 18px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #21618c;
        }
    </style>
</head>

<body>

    <h1>Our Products</h1>

    <div class="products">

        <div class="product-card">
            <img src="https://placehold.co/300x200?text=Watch" alt="Smart watch">
            <h2>Smart Watch</h2>
            <p class="price">₹1,499</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/300x200?text=Shoes" alt="Sports shoes">
            <h2>Sports Shoes</h2>
            <p class="price">₹999</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/300x200?text=Bag" alt="Travel bag">
            <h2>Travel Bag</h2>
            <p class="price">₹799</p>
            <button>Buy Now</button>
        </div>

        <div class="product-card">
            <img src="https://placehold.co/300x200?text=Headphones" alt="Headphones">
            <h2>Headphones</h2>
            <p class="price">₹1,199</p>
            <button>Buy Now</button>
        </div>

    </div>

</body>
</html>
