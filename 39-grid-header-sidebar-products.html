<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Header Sidebar Products</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f2f2f2;
        }

        .layout {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 70px 1fr;
            grid-template-areas:
                "header header"
                "sidebar products";
            min-height: 100vh;
        }

        /* Header */
        .header {
            grid-area: header;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
        }

        /* Sidebar */
        .sidebar {
            grid-area: sidebar;
            background-color: #34495e;
            color: white;
            padding: 20px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            margin: 20px 0;
        }

        /* Products Section */
        .products {
            grid-area: products;
            padding: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            align-content: start;
        }

        .product-card {
            background-color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }

        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }

        .price {
            color: green;
            font-weight: bold;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .layout {
                grid-template-columns: 1fr;
                grid-template-areas:
                    "header"
                    "sidebar"
                    "products";
            }

            .sidebar a {
                display: inline-block;
                margin-right: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="layout">

        <header class="header">
            <h2>My Shopping Website</h2>
        </header>

        <aside class="sidebar">
            <h3>Categories</h3>
            <a href="#">Electronics</a>
            <a href="#">Fashion</a>
            <a href="#">Accessories</a>
            <a href="#">Footwear</a>
        </aside>

        <main class="products">

            <div class="product-card">
                <img src="https://placehold.co/300x200?text=Watch" alt="Smart watch">
                <h3>Smart Watch</h3>
                <p class="price">₹1,499</p>
                <button>Buy Now</button>
            </div>

            <div class="product-card">
                <img src="https://placehold.co/300x200?text=Shoes" alt="Sports shoes">
                <h3>Sports Shoes</h3>
                <p class="price">₹999</p>
                <button>Buy Now</button>
            </div>

            <div class="product-card">
                <img src="https://placehold.co/300x200?text=Bag" alt="Travel bag">
                <h3>Travel Bag</h3>
                <p class="price">₹799</p>
                <button>Buy Now</button>
            </div>

            <div class="product-card">
                <img src="https://placehold.co/300x200?text=Headphones" alt="Headphones">
                <h3>Headphones</h3>
                <p class="price">₹1,199</p>
                <button>Buy Now</button>
            </div>

        </main>

    </div>

</body>
</html>
