<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Tokens</title>

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --background-color: #f4f4f4;
            --text-color: #333333;
            --spacing: 20px;
            --main-font: Arial, sans-serif;
        }

        body {
            font-family: var(--main-font);
            background-color: var(--background-color);
            color: var(--text-color);
            margin: var(--spacing);
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: var(--spacing);
            text-align: center;
        }

        main {
            background-color: white;
            padding: var(--spacing);
            margin-top: var(--spacing);
        }

        h2 {
            color: var(--secondary-color);
        }

        button {
            background-color: var(--secondary-color);
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }

        footer {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: var(--spacing);
        }
    </style>
</head>

<body>

    <header>
        <h1>My Design Tokens Website</h1>
        <p>Learning CSS Variables</p>
    </header>

    <main>
        <h2>About Design Tokens</h2>
        <p>
            Design tokens are reusable CSS variables that help
            maintain consistent colours, fonts and spacing
            throughout a website.
        </p>

        <button>Learn More</button>
    </main>

    <footer>
        <p>Created by Priya Yadav | 2026</p>
    </footer>

</body>
</html>
