<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Size Chart</title>
</head>
<body>

    <h1>Clothing Size Chart</h1>

    <table border="1">
        <caption>Men's T-Shirt Size Chart</caption>

        <thead>
            <tr>
                <th>Size</th>
                <th>Chest (inches)</th>
                <th>Length (inches)</th>
                <th>Shoulder (inches)</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Small (S)</td>
                <td>36</td>
                <td>26</td>
                <td>16</td>
            </tr>

            <tr>
                <td>Medium (M)</td>
                <td>38</td>
                <td>27</td>
                <td>17</td>
            </tr>

            <tr>
                <td>Large (L)</td>
                <td>40</td>
                <td>28</td>
                <td>18</td>
            </tr>

            <tr>
                <td>Extra Large (XL)</td>
                <td>42</td>
                <td>29</td>
                <td>19</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
